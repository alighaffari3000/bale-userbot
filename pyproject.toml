[project]
name = "bale-userbot"
version = "1.0.0"
description = "Infrastructure layer for building on a personal Bale account with BaleClient"
requires-python = ">=3.11,<3.14"
dependencies = [
    "BaleClient==1.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Image dimensions and cover thumbnails when sending photos.
media = ["Pillow>=10.0"]
# The read-only MCP server (bale-mcp) for AI agents.
mcp = ["mcp>=2,<3"]

[project.scripts]
bale-userbot = "bale_userbot.cli:main"
bale-mcp = "bale_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bale_userbot", "bale_mcp"]
